<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">
  
  <!-- Encabezado -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Nuestros productos elegidos para vos</h1>
        <p class="text-sm text-gray-500">Explorá nuestro catálogo y consultá al instante por WhatsApp.</p>
      </div>
      
      <!-- Buscador en tiempo real -->
      <div class="w-full md:w-80">
        <input type="text" id="searchInput" placeholder="Buscar por producto, marca o código..." 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
      </div>
    </div>
    
    <!-- Chips de Marcas Scrolleables -->
    <div class="max-w-7xl mx-auto px-4 pb-3 overflow-x-auto flex gap-2" id="brandChipsContainer">
      <button onclick="filterByBrand('TODAS')" class="brand-chip px-4 py-1.5 rounded-full text-xs font-medium bg-purple-600 text-white whitespace-nowrap shadow-sm">Todas</button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <div id="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-600"></div>
    </div>
    
    <div id="noResults" class="hidden text-center py-16 text-gray-500">
      No se encontraron productos que coincidan con tu búsqueda.
    </div>

    <!-- Grid de Tarjetas: Estrictamente 2 columnas por línea -->
    <div id="productsGrid" class="grid grid-cols-2 gap-4"></div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-4 text-center text-xs text-gray-500">
    Catálogo sincronizado en tiempo real.
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyIQqZPk3e_U17GjuO2LI99KS_wBWV0-91D_beFxaWOb0fWxLmS2gQEpBRwJaE5Y3E9aA/exec';
    let allProducts = [];
    let selectedBrand = 'TODAS';

    window.onload = function() {
      fetch(API_URL)
        .then(function(response) { return response.json(); })
        .then(function(result) {
          if (result.status === "success") {
            renderCatalog(result.data);
          } else {
            handleError(new Error(result.message));
          }
        })
        .catch(function(error) { handleError(error); });
    };

    function handleError(error) {
      document.getElementById('loading').innerHTML = '<p class="text-red-500 text-sm text-center">Error al cargar el catálogo: ' + error.message + '</p>';
    }

    function renderCatalog(products) {
      document.getElementById('loading').style.display = 'none';
      allProducts = products || [];
      buildBrandChips();
      filterAndDisplayProducts();
      
      document.getElementById('searchInput').addEventListener('input', filterAndDisplayProducts);
    }

    function buildBrandChips() {
      const brandsSet = new Set();
      for (var i = 0; i < allProducts.length; i++) {
        if (allProducts[i].marca) {
          brandsSet.add(allProducts[i].marca.trim());
        }
      }
      
      const container = document.getElementById('brandChipsContainer');
      var html = '<button onclick="filterByBrand(\'TODAS\')" class="brand-chip px-4 py-1.5 rounded-full text-xs font-medium ' + (selectedBrand === 'TODAS' ? 'bg-purple-600 text-white' : 'bg-gray-200 text-gray-700') + ' whitespace-nowrap shadow-sm transition-all">Todas</button>';
      
      var brandsArray = Array.from(brandsSet).sort();
      for (var j = 0; j < brandsArray.length; j++) {
        var b = brandsArray[j];
        var isActive = selectedBrand === b;
        var btnClass = isActive ? 'bg-purple-600 text-white' : 'bg-gray-200 text-gray-700';
        html += '<button onclick="filterByBrand(\'' + b + '\')" class="brand-chip px-4 py-1.5 rounded-full text-xs font-medium ' + btnClass + ' whitespace-nowrap shadow-sm transition-all">' + b + '</button>';
      }
      container.innerHTML = html;
    }

    function filterByBrand(brand) {
      selectedBrand = brand;
      buildBrandChips();
      filterAndDisplayProducts();
    }

    function filterAndDisplayProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('productsGrid');
      const noResults = document.getElementById('noResults');
      
      const filtered = [];
      for (var i = 0; i < allProducts.length; i++) {
        var p = allProducts[i];
        var matchesBrand = (selectedBrand === 'TODAS' || p.marca.toLowerCase() === selectedBrand.toLowerCase());
        var matchesQuery = !query || 
            p.producto.toLowerCase().indexOf(query) !== -1 || 
            p.marca.toLowerCase().indexOf(query) !== -1 || 
            p.cod.toString().toLowerCase().indexOf(query) !== -1;
            
        if (matchesBrand && matchesQuery) {
          filtered.push(p);
        }
      }

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      var html = '';

      for (var k = 0; k < filtered.length; k++) {
        var prod = filtered[k];
        
        var stockBadgeClass = '';
        var stockBadgeText = '';
        if (prod.stock <= 0) {
          stockBadgeClass = 'bg-gray-100 text-gray-600';
          stockBadgeText = 'Sin stock';
        } else if (prod.stock === 1) {
          stockBadgeClass = 'bg-red-100 text-red-700 font-bold';
          stockBadgeText = 'ÚLTIMA! 🔥';
        } else if (prod.stock < 3) {
          stockBadgeClass = 'bg-amber-100 text-amber-800 font-bold';
          stockBadgeText = 'ÚLTIMAS 3 🔥';
        } else {
          stockBadgeClass = 'bg-green-100 text-green-800';
          stockBadgeText = 'Disponible';
        }
        
        var formattedPrice = '$ ' + prod.precioVenta.toLocaleString('es-AR', {minimumFractionDigits: 0});
        var waMessage = 'Hola, me interesa un producto del catalogo, quiero información sobre ' + prod.producto + ', ' + prod.marca + ' y ' + formattedPrice + '.';
        var waUrl = 'https://wa.me/5491165295937?text=' + encodeURIComponent(waMessage);

        var imgHtml = prod.imagenUrl ? 
          '<img src="' + prod.imagenUrl + '" alt="' + prod.producto + '" class="w-full h-72 object-contain p-2 transition-transform duration-300 hover:scale-105">' : 
          '<div class="w-full h-72 bg-gray-100 flex items-center text-gray-400 text-xs justify-center">Sin imagen</div>';

        html += '<div class="bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow flex flex-col overflow-hidden relative">' +
          '<div class="absolute top-2 right-2 z-10">' +
            '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ' + stockBadgeClass + '">' + stockBadgeText + '</span>' +
          '</div>' +
          '<div class="bg-white flex items-center justify-center relative">' +
            imgHtml +
          '</div>' +
          '<div class="p-4 flex flex-col flex-grow justify-between">' +
            '<div>' +
              '<span class="text-[11px] font-medium text-purple-600 uppercase tracking-wider block mb-1">' + prod.marca + '</span>' +
              '<h3 class="text-sm sm:text-base font-semibold text-gray-800 line-clamp-2 mb-2">' + prod.producto + '</h3>' +
            '</div>' +
            '<div class="mt-2 pt-2 border-t border-gray-100">' +
              '<div class="flex flex-col sm:flex-row sm:items-baseline justify-between mb-3 gap-1">' +
                '<span class="text-base sm:text-lg font-bold text-gray-900">' + formattedPrice + '</span>' +
                '<span class="text-xs text-gray-500">Stock: ' + prod.stock + '</span>' +
              '</div>' +
              '<a href="' + waUrl + '" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm">' +
                '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>' +
                'Consultar por WhatsApp' +
              '</a>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      grid.innerHTML = html;
    }
  </script>
</body>
</html>
